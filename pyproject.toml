[project]
name = "rl-trading-news"
version = "0.1.0"
description = "Estudio comparativo de agentes RL con y sin senales de noticias"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "pyarrow==18.1.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::RuntimeWarning"]

[tool.uv]
package = false
