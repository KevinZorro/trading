# Hooks locales a proposito: ruff y mypy corren via `uv run`, con las mismas
# versiones pinneadas en pyproject.toml que usa el CI. Los hooks remotos
# (mirrors-ruff, mirrors-mypy) traen su propia version y derivan del CI en
# silencio, que es justo el fallo que un pre-commit deberia evitar.
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # datasets/ se excluye: son archivos verificados por SHA256 contra su
      # manifest, y el reporte de validacion es salida generada. Un hook que
      # los "arregle" rompe la verificacion.
      - id: trailing-whitespace
        exclude: ^datasets/
      - id: end-of-file-fixer
        exclude: ^datasets/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
        # Los datasets versionados son la excepcion declarada: se commitean sin
        # LFS para que un clon alcance para reproducir (ver CLAUDE.md, Tamano de
        # PR). Cada uno lleva manifest con SHA256; el resto sigue con el tope.
        exclude: ^datasets/
      - id: no-commit-to-branch
        # main esta protegida en GitHub; esto evita el viaje de ida y vuelta.
        args: [--branch, main]

  # Secretos: corre sobre lo que se esta por commitear, antes de que exista en
  # la historia. `gitleaks-system` usa el binario precompilado del PATH en vez
  # de compilarlo con Go (que no funciona sin Go instalado, p. ej. en Windows).
  # Version esperada: 8.21.2, la misma que pinnea el job `secretos` del CI;
  # instalacion por sistema operativo en el README.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks-system

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy-strict
        name: mypy --strict (src/)
        # Sobre todo src/, no sobre los archivos cambiados: mypy en modo strict
        # necesita el modulo completo para resolver tipos entre archivos, y un
        # chequeo parcial da falsos verdes.
        entry: uv run mypy src
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: pytest-anti-leakage
        name: anti-leakage
        # Rapidos (0.4 s) y son la garantia central del proyecto: no vale la
        # pena descubrir en CI que un cambio abrio una fuga de informacion.
        entry: uv run pytest -m leakage -q
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
