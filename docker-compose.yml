# Sombra de costos + watchdog (ADR 0007, PR 6). Guia: docs/despliegue-sombra.md
#
# Los secretos viven en `.env` junto a este archivo, solo en el servidor (esta en
# .gitignore). Los datos viven en el host, fuera del contenedor.
x-comun: &comun
  build:
    context: .
    args:
      GIT_SHA: ${GIT_SHA:-unknown}
  image: shadow:latest
  restart: unless-stopped
  env_file: .env
  environment:
    SHADOW_DATA_DIR: /data
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  shadow:
    <<: *comun
    command: ["python", "-m", "live.shadow"]
    volumes:
      - ${SHADOW_HOST_DATA:-/var/lib/shadow}:/data
      # Agente A congelado (ADR 0009), solo lectura. Sin pesos la sombra mide
      # costos igual y registra el fallo de los agentes en el heartbeat.
      - ${SHADOW_HOST_FROZEN:-/var/lib/shadow-frozen}:/frozen:ro
    # `environment` reemplaza al del ancla (no se fusiona): repetir SHADOW_DATA_DIR.
    environment:
      SHADOW_DATA_DIR: /data
      SHADOW_FROZEN_DIR: /frozen
    # Si el heartbeat se atrasa, Docker lo marca unhealthy y el watchdog avisa. El
    # reinicio de un proceso colgado lo hace el propio proceso (live.stall).
    healthcheck:
      test: ["CMD", "python", "-m", "live.health"]
      interval: 5m
      timeout: 20s
      start_period: 2m
      retries: 1

  # Contenedor aparte y con los datos en solo lectura: un proceso colgado no puede
  # vigilarse a si mismo. No monta el socket de Docker.
  watchdog:
    <<: *comun
    command: ["python", "-m", "live.watchdog"]
    volumes:
      - ${SHADOW_HOST_DATA:-/var/lib/shadow}:/data:ro

  # Grabador de noticias GDELT (Etapa 4, PR L1). Servicio e imagen propios, sin
  # `.env` ni secretos: desplegarlo NO toca `shadow` ni `watchdog` (la sombra tiene un
  # reloj de 30 dias en marcha). Levantar SOLO este servicio, ver
  # docs/despliegue-noticias.md: `docker compose up -d --no-deps noticias`.
  noticias:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: noticias:latest
    restart: unless-stopped
    command: ["python", "-m", "live.news"]
    environment:
      NEWS_DATA_DIR: /news
      NEWS_GIT_SHA: ${GIT_SHA:-unknown}
    volumes:
      - ${NEWS_HOST_DATA:-/var/lib/news}:/news
    # La VM tiene 1 GiB y la sombra carga torch: el grabador no puede quitarle memoria.
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-m", "live.news", "--health"]
      interval: 5m
      timeout: 20s
      start_period: 2m
      retries: 1
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
